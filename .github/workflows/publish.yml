name: Publish NuGet
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  aot:
    uses: ./.github/workflows/aot.yml
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/check-version.py
      - run: dotnet build PureDb.slnx -c Release
      - run: dotnet run --project tools/PureDb.SourceCheck -c Release --no-build
      - run: dotnet format whitespace src/PureDb/PureDb.csproj --no-restore --verify-no-changes
      - run: dotnet format whitespace src/PureDb.SqliteCompatibility/PureDb.SqliteCompatibility.csproj --no-restore --verify-no-changes
      - run: python scripts/prepare-sqlite.py
      - run: python scripts/test.py
      - run: python scripts/test-io-limits.py
      - run: dotnet tests/PureDb.StorageTests/bin/Release/net10.0/PureDb.StorageTests.dll --soak 1000000
      - run: python scripts/verify-public.py
      - run: python scripts/verify-candidate.py
  publish:
    needs: [test, aot]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/check-version.py
      - name: Check NuGet credentials
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: test -n "$NUGET_API_KEY" || { echo 'Missing repository secret NUGET_API_KEY'; exit 1; }
      - run: dotnet build PureDb.slnx -c Release
      - run: dotnet pack src/PureDb -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/PureDb.SqliteCompatibility -c Release --no-build -o artifacts/packages
      - run: python scripts/verify-packages.py
      - run: python scripts/package-smoke.py
      - run: python scripts/package-aot-smoke.py --rid linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages/*.nupkg
      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/packages/*.nupkg --clobber
          else
            options=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg --verify-tag "${options[@]}" --title "PureDb $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
