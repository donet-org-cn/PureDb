name: Native AOT
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            sqlite: artifacts/sqlite/3.54.1/sqlite3.dll
          - os: ubuntu-latest
            rid: linux-x64
            sqlite: artifacts/sqlite/3.54.1/libsqlite3.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            sqlite: artifacts/sqlite/3.54.1/libsqlite3.so
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/prepare-sqlite.py
      - run: python scripts/publish-deployment.py artifacts/aot-ci --rid ${{ matrix.rid }} --sqlite ${{ matrix.sqlite }} --validate-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aot-validation-${{ matrix.rid }}
          path: |
            artifacts/aot-ci/*.log
            artifacts/aot-ci/manifest.json
